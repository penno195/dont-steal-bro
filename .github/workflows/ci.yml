name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Rokit reads rokit.toml and installs the exact pinned tool versions
      # (Rojo, Wally, Selene, StyLua, Lune, luau-lsp). Aftman is no longer
      # actively maintained, so this project uses Rokit instead. Verified
      # directly against this action's action.yml source: it already runs
      # `rokit install --no-trust-check` internally, which is required -
      # Rokit prompts interactively to trust each tool on first use, and
      # that prompt has no non-interactive answer without this flag.
      - name: Install Rokit toolchain
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Install Wally packages
        run: wally install

      - name: Lint (Selene)
        run: selene src plugin

      - name: Format check (StyLua)
        run: stylua --check src plugin

      # luau-lsp's own `analyze` subcommand, not the standalone
      # `luau-analyze-rojo` tool build-plan.html's prompt originally
      # suggested - that tool hasn't been released since 2022 and its
      # embedded Luau parser can't read current definitions-file syntax.
      # luau-lsp is JohnnyMorganz's actively maintained replacement for
      # exactly this purpose, confirmed via its own README. Needs a Rojo
      # sourcemap (not the deprecated --project flag) and a Roblox global
      # type definitions file pulled from the *same pinned luau-lsp tag*
      # rather than its master branch, since the definitions file's
      # syntax and the analyzer's parser must stay in lockstep - this
      # exact mismatch is what broke the luau-analyze-rojo approach.
      - name: Generate Rojo sourcemap
        run: rojo sourcemap default.project.json -o sourcemap.json

      - name: Fetch Roblox type definitions
        run: curl -sL -o globalTypes.d.luau "https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/1.69.0/scripts/globalTypes.d.luau"

      - name: Type check (luau-lsp analyze)
        run: luau-lsp analyze --sourcemap=sourcemap.json --definitions=globalTypes.d.luau src

      # The map validator (P7-1) ships as a Studio plugin, not inside the
      # place, so it's its own Rojo project and needs its own sourcemap
      # for `script.Parent.MapCheck` to resolve.
      - name: Type check map validator plugin (luau-lsp analyze)
        run: |
          rojo sourcemap plugin.project.json -o plugin-sourcemap.json
          luau-lsp analyze --sourcemap=plugin-sourcemap.json --definitions=globalTypes.d.luau plugin

      # Pure-logic tests only (Outcomes, pricing, ranking, tie-breaks,
      # streak maths - Ground Rule 4). Roblox-API-touching code is tested
      # manually in Studio's "Clients and Servers" mode, not here. This
      # deliberately does not include the Packages/ServerPackages trees
      # luau-lsp's sourcemap picks up - third-party dependencies aren't
      # this project's code to lint, format, or type-check.
      - name: Run pure-logic tests (Lune)
        run: lune run tests/run
