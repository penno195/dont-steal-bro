<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="456" viewBox="0 0 1440 456">
  <!-- Studio Corvus community banner, in the style of the game's icon and
       thumbnail: bright sky, gold burst, chunky white/yellow lettering
       outlined in red. No logo: Roblox lays the community icon (the
       raven) over the bottom-left corner, so keep x < 520, y > 250 free of
       anything that matters.
       Roblox shows it object-fit: cover in a taller box: the top 79px is
       always cropped, and below ~1900px wide only x 155-1285 shows. On
       desktop the icon and name cover about x 320-590, y 350-456. Keep the
       title inside x 200-1240, y 100-340. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E6FD9"/>
      <stop offset="0.6" stop-color="#3FA9F5"/>
      <stop offset="1" stop-color="#9ED8FF"/>
    </linearGradient>
    <radialGradient id="burst" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6C8" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#FFC93C" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFC93C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="yellowText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF27A"/>
      <stop offset="0.55" stop-color="#FFC21A"/>
      <stop offset="1" stop-color="#FF8A00"/>
    </linearGradient>
    <linearGradient id="whiteText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E8F0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE98A"/>
      <stop offset="1" stop-color="#F2A900"/>
    </linearGradient>
    <symbol id="coin" viewBox="-34 -34 68 68" overflow="visible">
      <circle r="30" cy="4" fill="#B07800" stroke="#5A3A00" stroke-width="3"/>
      <circle r="28" fill="url(#gold)"/>
      <circle r="20" fill="none" stroke="#D99A00" stroke-width="3"/>
      <text y="13" text-anchor="middle" font-family="Segoe UI Black, Arial Black, sans-serif" font-weight="900" font-size="34" fill="#C98A00">$</text>
      <path d="M -18 -12 Q -12 -20 -3 -22" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    </symbol>
    <symbol id="coinEdge" viewBox="-34 -34 68 68" overflow="visible">
      <ellipse rx="30" ry="11" cy="4" fill="#B07800" stroke="#5A3A00" stroke-width="3"/>
      <ellipse rx="28" ry="9" fill="url(#gold)"/>
    </symbol>
    <symbol id="cash" viewBox="-50 -26 100 52" overflow="visible">
      <rect x="-48" y="-24" width="96" height="48" rx="5" fill="#4CC96B" stroke="#1E7A36" stroke-width="3"/>
      <rect x="-40" y="-16" width="80" height="32" rx="3" fill="none" stroke="#2E9E4C" stroke-width="2.5"/>
      <circle r="12" fill="#2E9E4C"/>
      <text y="7" text-anchor="middle" font-family="Segoe UI Black, Arial Black, sans-serif" font-weight="900" font-size="20" fill="#BDF5C9">$</text>
    </symbol>
  </defs>

  <rect width="1440" height="456" fill="url(#sky)"/>
  <g fill="#FFFFFF" opacity="0.16" transform="translate(-210 20)"><path d="M 930 190 L 2530 190 L 2520 366 Z"/><path d="M 930 190 L 2490 546 L 2441 715 Z"/><path d="M 930 190 L 2372 884 L 2287 1038 Z"/><path d="M 930 190 L 2181 1188 L 2064 1319 Z"/><path d="M 930 190 L 1928 1441 L 1784 1543 Z"/><path d="M 930 190 L 1624 1632 L 1462 1699 Z"/><path d="M 930 190 L 1286 1750 L 1113 1780 Z"/><path d="M 930 190 L 930 1790 L 754 1780 Z"/><path d="M 930 190 L 574 1750 L 405 1701 Z"/><path d="M 930 190 L 236 1632 L 82 1547 Z"/><path d="M 930 190 L -68 1441 L -199 1324 Z"/><path d="M 930 190 L -321 1188 L -423 1044 Z"/><path d="M 930 190 L -512 884 L -579 722 Z"/><path d="M 930 190 L -630 546 L -660 373 Z"/><path d="M 930 190 L -670 190 L -660 14 Z"/><path d="M 930 190 L -630 -166 L -581 -335 Z"/><path d="M 930 190 L -512 -504 L -427 -658 Z"/><path d="M 930 190 L -321 -808 L -204 -939 Z"/><path d="M 930 190 L -68 -1061 L 76 -1163 Z"/><path d="M 930 190 L 236 -1252 L 398 -1319 Z"/><path d="M 930 190 L 574 -1370 L 747 -1400 Z"/><path d="M 930 190 L 930 -1410 L 1106 -1400 Z"/><path d="M 930 190 L 1286 -1370 L 1455 -1321 Z"/><path d="M 930 190 L 1624 -1252 L 1778 -1167 Z"/><path d="M 930 190 L 1928 -1061 L 2059 -944 Z"/><path d="M 930 190 L 2181 -808 L 2283 -664 Z"/><path d="M 930 190 L 2372 -504 L 2439 -342 Z"/><path d="M 930 190 L 2490 -166 L 2520 7 Z"/></g>
  <ellipse cx="720" cy="210" rx="640" ry="300" fill="url(#burst)"/>

  <!-- clouds along the bottom -->
  <g fill="#FFFFFF" opacity="0.55">
    <circle cx="80" cy="470" r="90"/><circle cx="200" cy="450" r="70"/><circle cx="320" cy="480" r="80"/>
    <circle cx="600" cy="470" r="70"/><circle cx="700" cy="445" r="60"/><circle cx="800" cy="475" r="75"/>
    <circle cx="1080" cy="470" r="80"/><circle cx="1190" cy="450" r="65"/><circle cx="1320" cy="465" r="85"/><circle cx="1430" cy="450" r="60"/>
  </g>
  <g fill="#FFFFFF" opacity="0.35">
    <ellipse cx="560" cy="70" rx="70" ry="22"/><ellipse cx="600" cy="56" rx="40" ry="22"/>
    <ellipse cx="1180" cy="40" rx="80" ry="22"/><ellipse cx="1220" cy="26" rx="44" ry="20"/>
  </g>
  <path d="M 0 430 Q 720 404 1440 430 L 1440 456 L 0 456 Z" fill="#FFFFFF" opacity="0.35"/>

  <!-- cash and coins flying past, framing the title -->
  <use href="#cash" x="-50" y="-26" width="100" height="52" transform="translate(205 140) rotate(-22) scale(0.95)"/>
  <use href="#coin" x="-34" y="-34" width="68" height="68" transform="translate(230 250) rotate(-14) scale(1.0)"/>
  <use href="#coinEdge" x="-34" y="-34" width="68" height="68" transform="translate(90 200) rotate(28) scale(0.9)"/>
  <use href="#coin" x="-34" y="-34" width="68" height="68" transform="translate(70 90) rotate(18) scale(0.8)"/>
  <use href="#cash" x="-50" y="-26" width="100" height="52" transform="translate(1235 120) rotate(20) scale(0.85)"/>
  <use href="#coin" x="-34" y="-34" width="68" height="68" transform="translate(1250 250) rotate(14) scale(1.0)"/>
  <use href="#coinEdge" x="-34" y="-34" width="68" height="68" transform="translate(1180 330) rotate(-22) scale(0.8)"/>
  <use href="#coin" x="-34" y="-34" width="68" height="68" transform="translate(1370 180) rotate(-10) scale(0.85)"/>
  <use href="#cash" x="-50" y="-26" width="100" height="52" transform="translate(1360 360) rotate(-30) scale(0.85)"/>
  <use href="#coin" x="-34" y="-34" width="68" height="68" transform="translate(1000 365) rotate(8) scale(0.65)"/>
  <use href="#cash" x="-50" y="-26" width="100" height="52" transform="translate(760 380) rotate(10) scale(0.65)"/>

  <!-- title, game-logo style: tilted, white + yellow, red then dark outline -->
  <g transform="translate(-210 20) rotate(-4 930 190)" font-family="Segoe UI Black, Arial Black, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="2">
    <text x="930" y="190" font-size="100" stroke="#3A0606" stroke-width="34" stroke-linejoin="round">STUDIO <tspan>CORVUS</tspan></text>
    <text x="930" y="190" font-size="100" stroke="#E0262B" stroke-width="20" stroke-linejoin="round" fill="#E0262B">STUDIO <tspan>CORVUS</tspan></text>
    <text x="930" y="190" font-size="100" fill="url(#whiteText)">STUDIO <tspan fill="url(#yellowText)">CORVUS</tspan></text>
  </g>

  <!-- subtitle on a red ribbon -->
  <g transform="translate(-210 20) rotate(-4 930 190)">
    <path d="M 630 232 L 1230 232 L 1252 262 L 1230 292 L 630 292 L 608 262 Z" fill="#3A0606" transform="translate(0 6)"/>
    <path d="M 630 232 L 1230 232 L 1252 262 L 1230 292 L 630 292 L 608 262 Z" fill="#E0262B" stroke="#3A0606" stroke-width="5" stroke-linejoin="round"/>
    <text x="930" y="276" text-anchor="middle" font-family="Segoe UI Black, Arial Black, sans-serif" font-weight="900" font-size="38" letter-spacing="1" fill="#FFFFFF">MAKERS OF <tspan fill="#FFE27A">DON'T STEAL BRO!</tspan></text>
  </g>
</svg>
