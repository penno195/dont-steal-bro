<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#3A2275"/>
      <stop offset="1" stop-color="#120728"/>
    </radialGradient>
    <linearGradient id="bird" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1A4A"/>
      <stop offset="0.55" stop-color="#0D0618"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#F2A900"/>
    </linearGradient>
    <clipPath id="badge"><circle cx="256" cy="256" r="214"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="96" fill="#120728"/>
  <circle cx="256" cy="256" r="214" fill="url(#bg)"/>

  <g clip-path="url(#badge)">
    <!-- raven, facing right -->
    <path fill="url(#bird)" stroke="#6B4FC0" stroke-width="3" stroke-linejoin="round" d="
      M 108 520
      C 98 400 116 248 218 180
      C 260 150 322 144 358 180
      C 394 190 424 212 450 248
      C 420 252 388 258 356 266
      L 350 288
      Q 374 312 338 318
      Q 364 342 324 346
      Q 350 372 308 376
      Q 332 404 292 406
      Q 310 438 282 442
      L 290 520 Z"/>
    <!-- beak line -->
    <path d="M 356 250 Q 400 246 444 247" fill="none" stroke="#5A3FA0" stroke-width="4" stroke-linecap="round"/>
    <!-- rim-light feathers on the crown and nape -->
    <path d="M 196 212 Q 236 178 288 172" fill="none" stroke="#7A5CD6" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 150 300 Q 168 250 205 222" fill="none" stroke="#7A5CD6" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
    <!-- eye -->
    <circle cx="316" cy="200" r="17" fill="url(#gold)"/>
    <circle cx="320" cy="200" r="7" fill="#120728"/>
    <circle cx="311" cy="194" r="4" fill="#FFFFFF"/>
  </g>

  <circle cx="256" cy="256" r="214" fill="none" stroke="url(#gold)" stroke-width="14"/>
</svg>
