<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Studio Corvus mark: a raven in a bandit mask, making off with a gold
       coin. Corvids steal shiny things; the studio makes Don't Steal Bro!
       Bright sky, gold burst and red rim match the game's icon and thumbnail. -->
  <defs>
    <radialGradient id="bg" cx="78%" cy="58%" r="85%">
      <stop offset="0" stop-color="#FFF3B0"/>
      <stop offset="0.35" stop-color="#FFC93C"/>
      <stop offset="0.75" stop-color="#3FA9F5"/>
      <stop offset="1" stop-color="#1E6FD9"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFD23F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B2670"/>
      <stop offset="0.6" stop-color="#160B2E"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4B3A78"/>
      <stop offset="1" stop-color="#22163F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE98A"/>
      <stop offset="1" stop-color="#F2A900"/>
    </linearGradient>
    <linearGradient id="mask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5484D"/>
      <stop offset="1" stop-color="#B21F24"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="104"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- sunburst behind the coin -->
    <g fill="#FFFFFF" opacity="0.18"><path d="M 420 300 L 1120.0 300.0 L 1114.0933256003518 390.7438998337864 Z"/><path d="M 420 300 L 1096.1479674877532 481.1737455101593 L 1066.9562559091532 567.2968442387788 Z"/><path d="M 420 300 L 1026.2173541080574 650.000742253822 L 975.7299815038225 725.6338657317591 Z"/><path d="M 420 300 L 914.9738377578655 794.9756559016315 L 846.6314511360363 854.9645077854618 Z"/><path d="M 420 300 L 769.998515490782 906.2186397284802 L 688.4585572161251 946.4750598881882 Z"/><path d="M 420 300 L 601.1712618787723 976.1486329715185 L 511.9905711964716 993.929200142887 Z"/><path d="M 420 300 L 419.99742875642784 999.9999999952776 L 329.2535506196802 994.0929922747132 Z"/><path d="M 420 300 L 238.82377086089826 976.1473019948654 L 152.7007793600037 946.9552740686566 Z"/><path d="M 420 300 L 69.99703098786046 906.2160684794551 L -5.635907039091649 855.7284180595857 Z"/><path d="M 420 300 L -74.9774740387191 794.972019607421 L -134.96607488654138 726.629412634696 Z"/><path d="M 420 300 L -186.21992534072376 649.9962887230197 L -226.4760459871693 568.456182578825 Z"/><path d="M 420 300 L -256.14929844616086 481.16877824494077 L -273.92953803844114 391.9880222515718 Z"/><path d="M 420 300 L -279.9999999811106 299.9948575128557 L -274.09265893970974 209.25100107437112 Z"/><path d="M 420 300 L -256.14663649285455 118.82128723440039 L -226.95429221943084 32.69840296239278 Z"/><path d="M 420 300 L -186.21478284267346 -50.00519576573464 L -135.7268546078509 -125.63794834068148 Z"/><path d="M 420 300 L -74.97020145029819 -194.9792921691282 L -6.6273741275995235 -254.96764198013318 Z"/><path d="M 420 300 L 70.00593804946493 -306.2212109447879 L 151.5461920620973 -346.4770320774278 Z"/><path d="M 420 300 L 238.83370539133495 -376.1499639116802 L 328.0145266945691 -393.9298759246325 Z"/><path d="M 420 300 L 420.0077137307167 -399.99999995749886 L 510.75154846971384 -394.0923255953412 Z"/><path d="M 420 300 L 601.1811963896532 -376.14597098172067 L 687.3039734316119 -346.9533103614759 Z"/><path d="M 420 300 L 770.0074225146077 -306.2134971977125 L 845.6399896365285 -255.72529114861777 Z"/><path d="M 420 300 L 914.9811102928591 -194.96838328649687 L 974.9692090662371 -126.62533561474658 Z"/><path d="M 420 300 L 1026.2224965406726 -49.99183517332801 L 1066.478018158964 31.54856670664185 Z"/><path d="M 420 300 L 1096.1506293680768 118.83618903005532 L 1113.930213801461 208.01707564195138 Z"/></g>
    <!-- the coin's glow -->
    <circle cx="418" cy="318" r="150" fill="url(#halo)"/>

    <!-- mask ties, flapping behind the head -->
    <path d="M 120 214 Q 70 196 34 150 Q 82 166 112 176 Z" fill="url(#mask)" stroke="#1B0B33" stroke-width="7" stroke-linejoin="round"/>
    <path d="M 118 236 Q 62 250 22 226 Q 70 214 112 214 Z" fill="url(#mask)" stroke="#1B0B33" stroke-width="7" stroke-linejoin="round"/>

    <!-- head and neck, with ruffled feathers at the nape -->
    <path fill="url(#feather)" stroke="#1B0B33" stroke-width="8" stroke-linejoin="round" d="
      M 40 540
      L 64 430 L 40 420 L 78 372 L 56 356 L 100 316 L 84 292
      L 128 262 L 116 232
      C 150 160 236 128 300 140
      C 336 147 360 164 376 190
      L 384 226
      L 360 330
      C 330 380 300 420 290 540 Z"/>
    <!-- rim light on the crown so the dark head reads on the dark tile -->
    <path d="M 146 206 C 180 162 240 144 298 152" fill="none" stroke="#A98BFF" stroke-width="9" stroke-linecap="round"/>
    <path d="M 98 340 L 120 318 M 80 396 L 104 378" fill="none" stroke="#A98BFF" stroke-width="7" stroke-linecap="round" opacity="0.6"/>

    <!-- the coin, clamped in the beak -->
    <g transform="rotate(-14 420 300)">
      <ellipse cx="420" cy="300" rx="62" ry="62" fill="#B07800" stroke="#1B0B33" stroke-width="8"/>
      <ellipse cx="420" cy="294" rx="58" ry="58" fill="url(#gold)"/>
      <circle cx="420" cy="294" r="40" fill="none" stroke="#C98A00" stroke-width="6"/>
      <text x="420" y="318" text-anchor="middle" font-family="Segoe UI Black, Arial Black, sans-serif" font-weight="900" font-size="68" fill="#C98A00">$</text>
      <path d="M 380 262 Q 396 246 416 244" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- beak: upper mandible over the coin, lower one under it -->
    <path d="M 366 180 C 414 188 456 214 484 254 Q 490 268 478 274 C 440 258 404 256 364 266 Z" fill="url(#beak)" stroke="#1B0B33" stroke-width="8" stroke-linejoin="round"/>
    <path d="M 366 318 C 392 330 418 344 440 362 C 404 362 380 356 352 344 Z" fill="url(#beak)" stroke="#1B0B33" stroke-width="8" stroke-linejoin="round"/>

    <!-- bandit mask across the eye -->
    <path d="M 112 196 C 180 178 260 176 352 196 C 360 216 356 240 344 256 C 300 246 262 252 236 270 C 206 252 160 246 116 250 Z" fill="url(#mask)" stroke="#1B0B33" stroke-width="8" stroke-linejoin="round"/>
    <path d="M 132 204 C 200 190 270 190 336 204" fill="none" stroke="#FF8C8C" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

    <!-- the eye: gold, side-eyeing you -->
    <ellipse cx="296" cy="224" rx="28" ry="22" fill="url(#gold)" stroke="#1B0B33" stroke-width="6"/>
    <circle cx="308" cy="226" r="11" fill="#1B0B33"/>
    <circle cx="303" cy="219" r="4.5" fill="#FFFFFF"/>
    <!-- sly brow -->
    <path d="M 258 194 Q 292 186 330 200" fill="none" stroke="#1B0B33" stroke-width="9" stroke-linecap="round"/>

    <!-- sparkles off the coin -->
    <path stroke="#1B0B33" stroke-width="3" d="M 470 196 l 6 16 l 16 6 l -16 6 l -6 16 l -6 -16 l -16 -6 l 16 -6 Z" fill="#FFFFFF"/>
    <path d="M 482 392 l 4 10 l 10 4 l -10 4 l -4 10 l -4 -10 l -10 -4 l 10 -4 Z" fill="#FFE98A"/>
  </g>

  <!-- red rim, the same red that outlines the game logo -->
  <rect x="7" y="7" width="498" height="498" rx="98" fill="none" stroke="#E0262B" stroke-width="14"/>
  <rect x="16" y="16" width="480" height="480" rx="90" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.7"/>
</svg>
