[package]
name = "dontstealbro/game"
version = "0.1.0"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"

[dependencies]
# Signal — event/pub-sub pattern used by both server Services and client
# Controllers (e.g. RoundService broadcasting state changes internally).
# Shared realm because both sides use it, not because any single Signal
# instance itself crosses the client/server boundary.
Signal = "sleitnick/signal@2.0.3"

# Vide — fine-grained reactive UI library (chosen in P6-2 over React-lua,
# Fusion and plain Instance.new). Its source()/effect() model maps directly
# onto UIScaleController's observe(fn) -> disconnect surface, and it
# type-checks cleanly under --!strict. Shared realm only because Wally has
# no client-only realm; nothing on the server requires it.
Vide = "centau/vide@0.4.1"

[server-dependencies]
# ProfileStore — session-locked DataStore wrapper (successor to
# ProfileService). Server-only realm on purpose: player-data persistence
# logic has no reason to ship to a fully-compromised-by-assumption client
# (Ground Rule 1) — keeping it out of ReplicatedStorage.Packages means it
# never even reaches the client bundle.
#
# NOTE: this pins a third-party Wally republish (lm-loleris), not an
# official first-party Wally scope — ProfileStore's canonical distribution
# is GitHub/the Creator Store. Verify this is still the current
# recommended scope/version before relying on it long-term.
ProfileStore = "lm-loleris/profilestore@1.0.3"

# No [dev-dependencies] testing library is pinned here — see the "Testing"
# section of the README for why (Jest-Lua and TestEZ+Lemur were both
# evaluated and ruled out for this project's actual constraints).
